name: Refresh jobs from Discord

# The Netlify build pulls the jobbot's postings from the Discord #jobs channel
# (scripts/discord-jobs.js, run by `yarn build`). This triggers a production
# build on a schedule so the jobs page stays current between code changes.
# Nothing is committed, so branch protection on master doesn't come into it.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is not set"
            exit 1
          fi
          curl --fail --silent --show-error -X POST -d '{}' \
            "$NETLIFY_BUILD_HOOK?trigger_title=Scheduled+jobs+refresh"
