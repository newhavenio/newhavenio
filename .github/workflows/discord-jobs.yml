name: Sync jobs from Discord

# Pulls the jobbot's postings from the Discord #jobs channel into
# content/jobs/discord.json. Committing to master triggers a Netlify deploy.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-jobs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch jobs from Discord
        run: node scripts/discord-jobs.js
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_JOBS_CHANNEL_ID: ${{ secrets.DISCORD_JOBS_CHANNEL_ID }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- content/jobs/discord.json; then
            echo "No job changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/jobs/discord.json
          git commit -m "Update jobs from Discord"
          git push
